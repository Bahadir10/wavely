name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK via EAS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Types and Tests
        run: |
          npm run typecheck
          npm test

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        id: build_apk
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          echo "Building Android app with profile: $PROFILE"
          eas build --platform android --profile $PROFILE --non-interactive

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Wavely Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 📻 Wavely Live Radio Release ${{ github.ref_name }}
            
            Android APK has been built successfully via Expo EAS!
            You can install and test live radio streaming, lock screen media controls, and favorites.
